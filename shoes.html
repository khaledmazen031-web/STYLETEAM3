<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Shoes - STYLE TEAM</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

<audio id="bgMusic" loop preload="auto">
    <source src="https://xgwaqdtufwxqllytpxmv.supabase.co/storage/v1/object/public/Anything/Dave_ft_Tems_-_Raindance.mp3" type="audio/mpeg">
</audio>

<header class="header">

```
<div class="logo">
    STYLE TEAM
</div>

<nav class="navbar">

    <a href="index.html">Home</a>
    <a href="index.html#shop">Shop</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>

</nav>

<div class="header-icons">

    <button type="button"
            class="search-btn">
        ⌕
    </button>

    <button type="button"
            class="cart-btn"
            id="cartButton">

        🛒

        <span id="cartCount">
            0
        </span>

    </button>

</div>
```

</header>

<main>

<section class="shop" id="shop">

```
<div class="section-title">

    <p>
        SHOES
    </p>

    <h2>
        Shoes <span>Collection</span>
    </h2>

</div>


<div class="products">


    <article class="product-card"
             data-name="Sneakers"
             data-price="1200">

        <div class="product-image">

            <img src="https://i.postimg.cc/CK1ktGC9/IMG-20260909-142057.png"
                 alt="Sneakers">

        </div>

        <div class="product-info">

            <h3>
                Sneakers
            </h3>

            <p class="product-category">
                Shoes
            </p>

            <p class="product-price">
                1200 EGP
            </p>

        </div>

    </article>


</div>
```

</section>

</main>

<!-- CART -->

<div class="cart-overlay"
     id="cartOverlay">

```
<div class="cart">

    <div class="cart-header">

        <h2>
            Your Cart
        </h2>

        <button type="button"
                id="closeCart">

            ×

        </button>

    </div>


    <div class="cart-items"
         id="cartItems">

        <p class="empty-cart">
            Your cart is empty.
        </p>

    </div>


    <div class="cart-footer">

        <div class="cart-total">

            <span>
                Total
            </span>

            <strong id="cartTotal">
                0 EGP
            </strong>

        </div>


        <button type="button"
                class="checkout-btn"
                id="whatsappBtn">

            CONNECT ON WHATSAPP

        </button>

    </div>

</div>
```

</div>

<footer class="footer">

```
<div class="logo">
    STYLE TEAM
</div>

<p>
    © 2026 STYLE TEAM. All Rights Reserved.
</p>
```

</footer>

<script src="script.js"></script>

<script>

const bgMusic = document.getElementById("bgMusic");

function playMusic() {

    bgMusic.play().then(function() {

        console.log("Music started");

    }).catch(function(error) {

        console.log("Music error:", error);

    });

}

document.addEventListener("touchstart", playMusic, {
    once: true
});

document.addEventListener("click", playMusic, {
    once: true
});

</script>

</body>
</html>
